<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBOR Portfolio Verification</title>
</head>
<body>

    <div style="text-align: center; margin-top: 100px; font-family: Arial, sans-serif;">
        <h2>⚜️ NBOR Portfolio Portal ⚜️</h2>
        <p>Please enter your unique access token below to claim your template.</p>
        
        <input type="text" id="tokenInput" placeholder="Enter Token Code" style="padding: 10px; width: 250px; font-size: 16px;">
        <button id="unlockBtn" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">Unlock Template</button>
        
        <p id="messageDisplay" style="color: red; font-weight: bold; margin-top: 20px;"></p>
    </div>

    <!-- Ordinaryong javascript file na lang ang tinatawag natin dito -->
    <script src="script.js"></script>
</body>
</html>
